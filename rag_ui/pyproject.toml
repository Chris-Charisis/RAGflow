[project]
name = "rag-ui"
version = "2.0.0"
description = "RAGflow Streamlit chat UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.39.0",
    "requests>=2.32.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app"]
