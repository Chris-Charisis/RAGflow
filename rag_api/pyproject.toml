[project]
name = "rag-api"
version = "2.0.0"
description = "RAGflow query/answer API: hybrid retrieval + optional rerank + provider-agnostic LLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings==2.10.0",
    "requests>=2.32.5",
    "weaviate-client>=4.17.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    # LLM providers (lazy-imported; only the selected one is required at runtime)
    "langchain-ollama>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-anthropic>=0.3.0",
    # Lightweight default reranker (optional stage; off by default)
    "flashrank>=0.2.9",
]

# Optional reranker backends. Install with: pip install -e ".[cross-encoder]" / ".[cohere]"
[project.optional-dependencies]
cross-encoder = ["sentence-transformers>=3.0.0"]
cohere = ["cohere>=5.0.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rag_api", "rag_api.clients", "rag_api.rag"]
