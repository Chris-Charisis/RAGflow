services:

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    restart: unless-stopped
    ports:
      - 9000:9000
      - 9001:9001
    env_file:
      - .env
    volumes:
      - minio_data:/data
    networks:
      - app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10      
    command: server /data --console-address ":9001"    

  ollama:
    image: ollama/ollama:0.12.9
    container_name: ollama
    restart: unless-stopped
    ports:
      - 11434:11434
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "-v"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    runtime: nvidia
  
  model-downloader:
    build:
      context: ./model_downloader
    container_name: model-downloader
    # restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
      # Embedding model (ingestion) + chat model (rag_api default LLM).
      - MODEL=mxbai-embed-large:335m,llama3.1:8b
    networks:
      - app
    
  rabbitmq:
    build:
      context: ./rabbitmq
    container_name: rabbitmq
    hostname: rabbitmq
    environment:
      - RABBITMQ_NODENAME=rabbit@rabbitmq
    restart: unless-stopped
    ports:
      - 5672:5672
      - 15672:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10      
    env_file:
      - .env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app
    
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.33.4
    container_name: weaviate
    ports:
      - 8080:8080
      - 50051:50051
    volumes:
      - weaviate_data:/var/lib/weaviate
    restart: on-failure:0
    command:
      - --host
      - 0.0.0.0
      - --port
      - '8080'
      - --scheme
      - http
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      CLUSTER_HOSTNAME: 'node1'
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'false'
      AUTHENTICATION_APIKEY_ENABLED: 'true'
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: 'user-a-key,user-b-key'
      AUTHENTICATION_APIKEY_USERS: 'user-a,user-b'
      AUTHORIZATION_ENABLE_RBAC: 'true'
      AUTHORIZATION_RBAC_ROOT_USERS: 'user-a'
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s    
    networks:
      - app

  pdf_reader:
    build:
      context: ./pdf_reader
    restart: unless-stopped
    container_name: pdf_reader
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app     

  text_chunker:
    build:
      context: .
      dockerfile: text_chunker/Dockerfile
    restart: unless-stopped
    container_name: text_chunker
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy      
    networks:
      - app

  embedder:
    build:
      context: ./embedder
    restart: unless-stopped
    container_name: embedder
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      ollama:
        condition: service_healthy   
    networks:
      - app

  vector_indexer:
    build:
      context: .
      dockerfile: vector_indexer/Dockerfile
    restart: unless-stopped
    container_name: vector_indexer
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    networks:
      - app

  # ---------------- v2.0: retrieval + generation (the "R" and "G" of RAG) ----------------
  rag_api:
    build:
      context: ./rag_api
    container_name: rag_api
    restart: unless-stopped
    ports:
      - 8000:8000
    env_file:
      - .env
    depends_on:
      weaviate:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app

  rag_ui:
    build:
      context: ./rag_ui
    container_name: rag_ui
    restart: unless-stopped
    ports:
      - 3000:8501
    environment:
      - RAG_API_URL=http://rag_api:8000
    depends_on:
      rag_api:
        condition: service_healthy
    networks:
      - app

  # One-shot Ragas evaluation. Gated behind the 'eval' profile so it never
  # starts with the stack. Run on demand:
  #   docker compose run --rm rag_eval --dataset /data/questions.jsonl --output /data/results.csv
  rag_eval:
    build:
      context: ./rag_eval
    container_name: rag_eval
    profiles: ["eval"]
    env_file:
      - .env
    environment:
      - RAG_API_URL=http://rag_api:8000
    volumes:
      - ./eval_data:/data
    depends_on:
      rag_api:
        condition: service_healthy
    networks:
      - app

volumes:
  minio_data:
  rabbitmq_data:
  weaviate_data:
  ollama_data:

networks:
  app:
    driver: bridge